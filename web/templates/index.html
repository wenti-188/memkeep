<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MemKeep · Agent 长期记忆</title>
<style>
  :root{
    --bg:#f5f5f7; --panel:#ffffff; --ink:#1b1b1f; --muted:#6e6e78;
    --line:#e6e6ec; --accent:#6d5cf6; --accent-soft:#efeaff;
    --ok:#1f9d63; --warn:#c2791b; --danger:#c8443f;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg); color:var(--ink); height:100vh; display:flex; flex-direction:column;
    -webkit-font-smoothing:antialiased;
  }
  header{
    height:56px; display:flex; align-items:center; gap:12px; padding:0 20px;
    background:rgba(255,255,255,.86); backdrop-filter:blur(12px);
    border-bottom:1px solid var(--line); flex-shrink:0;
  }
  .logo{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,#7b6bff,#4b3fd6);
    display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;font-weight:700}
  header h1{font-size:15px;font-weight:600;letter-spacing:.02em}
  header .sub{font-size:12px;color:var(--muted)}
  header .spacer{flex:1}
  .pill{font-size:11px;padding:4px 9px;border-radius:999px;background:var(--accent-soft);color:#4b3fd6;font-weight:600}

  main{flex:1;display:flex;min-height:0}

  /* 左：对话 */
  .chat{flex:1;display:flex;flex-direction:column;min-width:0}
  .msgs{flex:1;overflow-y:auto;padding:24px 28px;display:flex;flex-direction:column;gap:18px}
  .empty{margin:auto;text-align:center;color:var(--muted);font-size:13px;line-height:1.9}
  .empty b{color:var(--ink);font-size:15px;display:block;margin-bottom:8px}
  .msg{display:flex;gap:10px;max-width:760px}
  .msg.user{align-self:flex-end;flex-direction:row-reverse}
  .avatar{width:28px;height:28px;border-radius:8px;flex-shrink:0;display:flex;align-items:center;
    justify-content:center;font-size:12px;font-weight:700}
  .avatar.ai{background:var(--accent-soft);color:#4b3fd6}
  .avatar.me{background:#1b1b1f;color:#fff}
  .bubble{padding:11px 14px;border-radius:12px;font-size:14px;line-height:1.65;
    background:var(--panel);border:1px solid var(--line);white-space:pre-wrap;word-break:break-word}
  .msg.user .bubble{background:#1b1b1f;color:#fff;border-color:#1b1b1f}
  .meta{font-size:11px;color:var(--muted);margin-top:6px;padding:0 4px}
  .meta .tag{display:inline-block;padding:1px 6px;border-radius:5px;background:#f0f0f4;margin-right:4px}
  .meta .tag.write{background:#e8f6ee;color:var(--ok)}
  .meta .tag.refuse{background:#fff3e4;color:var(--warn)}

  .composer{padding:14px 24px 20px;background:transparent}
  .box{max-width:760px;margin:0 auto;background:var(--panel);border:1px solid var(--line);
    border-radius:14px;padding:10px 10px 10px 16px;display:flex;align-items:flex-end;gap:10px;
    box-shadow:0 4px 18px rgba(20,20,40,.05);transition:border-color .15s}
  .box:focus-within{border-color:#cbc3ff;box-shadow:0 6px 22px rgba(109,92,246,.12)}
  textarea{flex:1;border:0;outline:0;resize:none;font-size:14px;line-height:1.6;
    font-family:inherit;background:transparent;max-height:120px;color:var(--ink)}
  textarea::placeholder{color:#a8a8b4}
  .send{width:34px;height:34px;border-radius:10px;border:0;background:var(--accent);color:#fff;
    cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center;
    transition:opacity .15s, transform .1s}
  .send:disabled{opacity:.35;cursor:not-allowed}
  .send:active{transform:scale(.96)}
  .hint{max-width:760px;margin:8px auto 0;font-size:11px;color:#9a9aa8;text-align:center}

  /* 右：记忆面板 */
  .side{width:390px;flex-shrink:0;border-left:1px solid var(--line);background:var(--panel);
    display:flex;flex-direction:column;min-height:0}
  .side-head{padding:16px 18px 12px;border-bottom:1px solid var(--line)}
  .side-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .side-title h2{font-size:13px;font-weight:600}
  .side-title .count{font-size:11px;color:var(--muted)}
  .bars{display:flex;gap:6px;flex-wrap:wrap}
  .cat{font-size:10.5px;padding:3px 8px;border-radius:6px;background:#f4f4f7;color:var(--muted)}
  .cat b{color:var(--ink);font-weight:600}

  .list{flex:1;overflow-y:auto;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
  .card{border:1px solid var(--line);border-radius:10px;padding:10px 11px;background:#fcfcfd;
    position:relative;transition:border-color .15s, box-shadow .15s}
  .card:hover{border-color:#dcd6ff;box-shadow:0 3px 12px rgba(109,92,246,.08)}
  .card.superseded{opacity:.55;text-decoration:line-through}
  .card-top{display:flex;align-items:center;gap:6px;margin-bottom:5px}
  .dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
  .attr{font-size:11.5px;font-weight:600;color:#3c3c46;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .del{border:0;background:transparent;color:#c0c0cc;cursor:pointer;font-size:13px;padding:0 2px;line-height:1}
  .del:hover{color:var(--danger)}
  .val{font-size:12px;line-height:1.55;color:#4a4a56}
  .foot{display:flex;align-items:center;gap:8px;margin-top:8px}
  .score{flex:1;height:3px;background:#eeeef3;border-radius:3px;overflow:hidden}
  .score i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,#8f80ff,#6d5cf6)}
  .score-num{font-size:10px;color:#9a9aa8;font-variant-numeric:tabular-nums}

  .empty-side{margin:auto;text-align:center;color:#a8a8b4;font-size:12px;line-height:1.9;padding:30px}

  /* 加载动画 */
  .typing{display:inline-flex;gap:4px;align-items:center;padding:2px 0}
  .typing i{width:6px;height:6px;border-radius:50%;background:#c9c9d6;animation:bounce 1.2s infinite}
  .typing i:nth-child(2){animation-delay:.18s}
  .typing i:nth-child(3){animation-delay:.36s}
  @keyframes bounce{0%,60%,100%{transform:translateY(0);opacity:.6}30%{transform:translateY(-4px);opacity:1}}

  .spin{width:13px;height:13px;border:2px solid #e0dcff;border-top-color:var(--accent);
    border-radius:50%;animation:rot .7s linear infinite;display:inline-block}
  @keyframes rot{to{transform:rotate(360deg)}}

  ::-webkit-scrollbar{width:8px;height:8px}
  ::-webkit-scrollbar-thumb{background:#dcdce4;border-radius:4px}
  ::-webkit-scrollbar-thumb:hover{background:#c8c8d4}
</style>
</head>
<body>

<header>
  <div class="logo">M</div>
  <div>
    <h1>MemKeep</h1>
    <div class="sub">Agent 长期记忆 · 写入 / 冲突 / 遗忘 / 检索</div>
  </div>
  <div class="spacer"></div>
  <span class="pill" id="statusPill">就绪</span>
</header>

<main>
  <section class="chat">
    <div class="msgs" id="msgs">
      <div class="empty">
        <b>它记得你说过的每件事</b>
        问它「我讨厌什么岗位」，隔天重开再问一次。<br>
        右侧面板是它的记忆，可以看、可以删。
      </div>
    </div>
    <div class="composer">
      <div class="box">
        <textarea id="input" rows="1" placeholder="说点什么，比如：我不考虑外包岗"></textarea>
        <button class="send" id="send" title="发送">↑</button>
      </div>
      <div class="hint">回答只依据记忆库，没有记录会明确说「没记录」</div>
    </div>
  </section>

  <aside class="side">
    <div class="side-head">
      <div class="side-title">
        <h2>记忆面板</h2>
        <span class="count" id="count">0 条</span>
      </div>
      <div class="bars" id="cats"></div>
    </div>
    <div class="list" id="list">
      <div class="empty-side">还没有记忆<br>聊两句就会自动生成</div>
    </div>
  </aside>
</main>

<script>
const CAT_COLORS = {
  identity: '#6d5cf6', preference: '#1f9d63', goal: '#c2791b',
  relation: '#2b7fd4', event: '#8b8b98'
};
const CAT_NAMES = { identity:'身份', preference:'偏好', goal:'目标', relation:'关系', event:'事件' };

const input = document.getElementById('input');
const sendBtn = document.getElementById('send');
const msgs = document.getElementById('msgs');
const listEl = document.getElementById('list');
const countEl = document.getElementById('count');
const catsEl = document.getElementById('cats');
const pill = document.getElementById('statusPill');

let busy = false;

function setStatus(text, spin) {
  pill.textContent = text;
  pill.style.background = spin ? '#fff3e4' : '#efeaff';
  pill.style.color = spin ? '#a4650f' : '#4b3fd6';
}

function addMsg(role, text, meta) {
  const wrap = document.createElement('div');
  wrap.className = 'msg ' + (role === 'user' ? 'user' : '');
  const av = document.createElement('div');
  av.className = 'avatar ' + (role === 'user' ? 'me' : 'ai');
  av.textContent = role === 'user' ? '我' : 'M';
  const col = document.createElement('div');
  const b = document.createElement('div');
  b.className = 'bubble';
  b.textContent = text;
  col.appendChild(b);
  if (meta) {
    const m = document.createElement('div');
    m.className = 'meta';
    m.innerHTML = meta;
    col.appendChild(m);
  }
  wrap.appendChild(av);
  wrap.appendChild(col);
  msgs.appendChild(wrap);
  msgs.scrollTop = msgs.scrollHeight;
  return col;
}

function addTyping() {
  const wrap = document.createElement('div');
  wrap.className = 'msg';
  wrap.id = 'typingRow';
  const av = document.createElement('div');
  av.className = 'avatar ai';
  av.textContent = 'M';
  const col = document.createElement('div');
  const b = document.createElement('div');
  b.className = 'bubble';
  const t = document.createElement('span');
  t.className = 'typing';
  t.innerHTML = '<i></i><i></i><i></i>';
  b.appendChild(t);
  col.appendChild(b);
  wrap.appendChild(av);
  wrap.appendChild(col);
  msgs.appendChild(wrap);
  msgs.scrollTop = msgs.scrollHeight;
}

function removeTyping() {
  const r = document.getElementById('typingRow');
  if (r) r.remove();
}

async function loadMemories() {
  try {
    const r = await fetch('/api/memories');
    const d = await r.json();
    renderMemories(d.memories, d.stats);
  } catch (e) {
    console.error(e);
  }
}

function renderMemories(rows, stats) {
  countEl.textContent = (stats.total || 0) + ' 条';
  catsEl.innerHTML = '';
  Object.entries(stats.by_category || {}).forEach(([k, v]) => {
    const el = document.createElement('span');
    el.className = 'cat';
    el.innerHTML = CAT_NAMES[k] + ' <b>' + v + '</b>';
    catsEl.appendChild(el);
  });

  listEl.innerHTML = '';
  if (!rows.length) {
    listEl.innerHTML = '<div class="empty-side">还没有记忆<br>聊两句就会自动生成</div>';
    return;
  }
  rows.forEach(m => {
    const card = document.createElement('div');
    card.className = 'card' + (m.status === 'superseded' ? ' superseded' : '');

    const top = document.createElement('div');
    top.className = 'card-top';
    const dot = document.createElement('span');
    dot.className = 'dot';
    dot.style.background = CAT_COLORS[m.category] || '#999';
    const attr = document.createElement('span');
    attr.className = 'attr';
    attr.textContent = m.attribute;
    const del = document.createElement('button');
    del.className = 'del';
    del.textContent = '×';
    del.title = '删除这条记忆';
    del.onclick = async () => {
      await fetch('/api/memories/' + m.id, { method: 'DELETE' });
      loadMemories();
    };
    top.appendChild(dot); top.appendChild(attr); top.appendChild(del);

    const val = document.createElement('div');
    val.className = 'val';
    val.textContent = m.value;

    const foot = document.createElement('div');
    foot.className = 'foot';
    const sc = document.createElement('div');
    sc.className = 'score';
    const bar = document.createElement('i');
    bar.style.width = Math.min(100, (m.score || 0) * 100) + '%';
    sc.appendChild(bar);
    const num = document.createElement('span');
    num.className = 'score-num';
    num.textContent = (m.score || 0).toFixed(2);
    foot.appendChild(sc); foot.appendChild(num);

    card.appendChild(top); card.appendChild(val); card.appendChild(foot);
    listEl.appendChild(card);
  });
}

async function send() {
  const text = input.value.trim();
  if (!text || busy) return;
  busy = true;
  sendBtn.disabled = true;
  setStatus('思考中…', true);

  const emptyTip = msgs.querySelector('.empty');
  if (emptyTip) emptyTip.remove();

  addMsg('user', text);
  input.value = '';
  input.style.height = 'auto';
  addTyping();

  try {
    const r = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text })
    });
    const d = await r.json();
    removeTyping();

    let meta = '';
    if (d.refused) {
      meta = '<span class="tag refuse">无相关记忆 · 拒绝作答</span>';
    } else {
      meta = '<span class="tag">' + (d.intent || '') + '</span>';
      if (d.used && d.used.length) meta += '<span class="tag">引用 ' + d.used.length + ' 条记忆</span>';
    }
    if (d.written && d.written.length) {
      meta += '<span class="tag write">写入 ' + d.written.length + ' 条</span>';
    }
    addMsg('ai', d.answer || '(空)', meta);
    setStatus('就绪', false);
    loadMemories();
  } catch (e) {
    removeTyping();
    addMsg('ai', '请求失败：' + e.message);
    setStatus('出错', false);
  } finally {
    busy = false;
    sendBtn.disabled = false;
    input.focus();
  }
}

sendBtn.onclick = send;
input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    send();
  }
});
input.addEventListener('input', () => {
  input.style.height = 'auto';
  input.style.height = Math.min(120, input.scrollHeight) + 'px';
});

loadMemories();
setInterval(loadMemories, 8000);
</script>
</body>
</html>
